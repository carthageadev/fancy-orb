<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Fancy Orbs — WebGL Nebula Orbs">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="1.2" r="1">
      <stop offset="0" stop-color="#241a4d"/>
      <stop offset="0.55" stop-color="#0d0d18"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.38" cy="0.3" r="1.15">
      <stop offset="0" stop-color="#1c1c33"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#c4b5fd" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- orb -->
  <g transform="translate(285, 310)">
    <circle r="195" fill="url(#glass)"/>
    <ellipse cx="-70" cy="-40" rx="105" ry="65" fill="#8B5CF6" opacity="0.28" filter="url(#soft)" transform="rotate(-20)"/>
    <ellipse cx="45" cy="25" rx="95" ry="55" fill="#3B82F6" opacity="0.24" filter="url(#soft)" transform="rotate(25)"/>
    <ellipse cx="-35" cy="55" rx="85" ry="45" fill="#EC4899" opacity="0.2" filter="url(#soft)" transform="rotate(-35)"/>
    <circle r="46" fill="url(#core)"/>
    <g fill="none">
      <ellipse rx="150" ry="112" stroke="url(#gal)" stroke-width="6" opacity="0.85" transform="rotate(-18)"/>
      <ellipse rx="118" ry="86" stroke="url(#gal)" stroke-width="4" opacity="0.55" transform="rotate(14)"/>
      <ellipse rx="82" ry="58" stroke="url(#gal)" stroke-width="3" opacity="0.4" transform="rotate(-34)"/>
    </g>
    <ellipse rx="134" ry="20" fill="#0a0a12" opacity="0.3" transform="rotate(-18)"/>
    <g fill="#ffffff">
      <circle cx="-120" cy="-105" r="2.4" opacity="0.95"/>
      <circle cx="150" cy="-60" r="1.8" opacity="0.8"/>
      <circle cx="-145" cy="30" r="1.5" opacity="0.65"/>
      <circle cx="40" cy="-140" r="1.4" opacity="0.7"/>
      <circle cx="130" cy="105" r="2.2" opacity="0.9"/>
      <circle cx="-95" cy="130" r="1.6" opacity="0.6"/>
      <circle cx="175" cy="25" r="1.2" opacity="0.55"/>
      <circle cx="-30" cy="-165" r="1.4" opacity="0.6"/>
      <circle cx="-165" cy="-40" r="1.2" opacity="0.5"/>
      <circle cx="65" cy="160" r="1.6" opacity="0.65"/>
      <circle cx="-60" cy="165" r="1.1" opacity="0.5"/>
      <circle cx="105" cy="-135" r="1.5" opacity="0.6"/>
      <circle cx="40" cy="-70" r="1" opacity="0.75"/>
      <circle cx="-40" cy="80" r="1.2" opacity="0.7"/>
      <circle cx="90" cy="45" r="1.3" opacity="0.85"/>
    </g>
    <path d="M-138 -128 A160 160 0 0 1 22 -182" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="6" stroke-linecap="round"/>
    <circle r="195" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2.5"/>
  </g>

  <!-- text -->
  <text x="560" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="8" fill="#8b5cf6">WEBGL SHADER SHOWCASE</text>
  <text x="560" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="700" letter-spacing="-1" fill="#f4f5f7">Fancy Orbs</text>
  <text x="560" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#9aa1b0">Galaxies in glass — starfield, nebulae and</text>
  <text x="560" y="428" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#9aa1b0">aurora rendered entirely in WebGL fragment</text>
  <text x="560" y="464" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#9aa1b0">shaders. One seed per orb — pure GPU math.</text>
</svg>